server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/apiprovide?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

spring.mybatis.mapper-locations=classpath:mapper/*.xml
spring.mybatis.type-aliases-package=com.niujl.bean

# 启动时自动执行幂等建表脚本（CREATE TABLE IF NOT EXISTS）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ===== JWT =====
# 生产环境请通过环境变量覆盖
app.jwt.secret=please-change-me-32bytes-secret-key-0001
app.jwt.expire-seconds=604800

# ===== 手机号确定性 AES（固定 Key + 固定 IV + pepper）=====
# 生产环境请通过环境变量覆盖；AES Key/IV 必须为 16 字节
app.crypto.aes-key=0123456789abcdef
app.crypto.aes-iv=abcdef0123456789
app.crypto.pepper=niujl

# ===== 短信服务（mock=true 时使用 Mock：固定验证码）=====
app.sms.mock=true
app.sms.mock-code=123456
app.sms.access-key-id=
app.sms.access-key-secret=
app.sms.code-expire-seconds=300
app.sms.send-interval-seconds=60

# ===== 微信登录（mock=true 时使用 Mock）=====
app.wechat.mock=true
app.wechat.appid=
app.wechat.secret=

# ===== 苹果登录（mock=true 时使用 Mock）=====
app.apple.mock=true
app.apple.client-id=
app.apple.team-id=